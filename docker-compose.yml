services:
  toolchain:
    build:
      context: .
      args:
        USER: "${USER:-dev}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: arm-qemu-toolchain:latest
    working_dir: /work
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
    # platform: linux/amd64  # (opcjonalnie wymuś architekturę)
